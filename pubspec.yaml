  file_picker: ^8.1.7
  uuid: ^3.0.7
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  permission_handler: ^11.4.0
  flutter_svg: ^2.0.17
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
